{% extends "account/base.html" %}

{% load i18n %}

{% block head_title %}{% trans "Change Password" %} — Django Shop{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card card" style="text-align: center;">
    <div class="brand" style="justify-content: center;"><span class="dot"></span>Django Shop</div>
    <h1 class="auth-title">{% trans "Password changed" %}</h1>
    <p class="auth-sub" style="margin-bottom: 20px;">{% trans 'Your password is now changed.' %}</p>
    <a href="{% url 'account_login' %}" class="btn btn-dark btn-block">{% trans "Back to Sign In" %}</a>
  </div>
</div>
{% endblock %}
